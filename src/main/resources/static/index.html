<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KollyTix</title>
    <style>
        :root{--bg:#0b0d14;--card:#141824;--text:#f1f3f9;--muted:#8d94a8;--line:#252b3b;--pink:#e11d2e;--s:27px;}
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        body{background:radial-gradient(circle at top,#141a2e 0,#0b0d14 55%);color:var(--text);min-height:100vh;}
        .g-NOW_SHOWING{background:linear-gradient(135deg,#e11d2e,#4b1fa8);}
        .g-UPCOMING{background:linear-gradient(135deg,#f7971e,#b36b00);}
        .g-RE_RELEASE{background:linear-gradient(135deg,#11998e,#0b5d52);}
        .g-CONCERT{background:linear-gradient(135deg,#00c6ff,#0050b3);}

        #splash{position:fixed;inset:0;background:radial-gradient(circle at center,#3a1c71,#0f0c29);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s;}
        #splash.hide{opacity:0;pointer-events:none;}
        #splash .logo{font-size:56px;font-weight:bold;letter-spacing:2px;animation:pop 1s ease;}
        #splash .logo span{color:var(--pink);}
        #splash p{margin-top:10px;color:#ccc;font-size:16px;}
        #splash .ld{margin-top:30px;width:220px;height:5px;background:#ffffff33;border-radius:5px;overflow:hidden;}
        #splash .ld i{display:block;height:100%;width:0;background:var(--pink);animation:fill 3.3s linear forwards;}
        @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
        @keyframes fill{to{width:100%}}

        header{background:rgba(11,13,20,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);color:#fff;padding:14px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:20;}
        header h1 span{color:var(--pink);}
        .hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
        #search{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#1a2030;color:#fff;width:200px;}
        .chip{border:1px solid var(--line);background:#1a2030;color:var(--text);padding:7px 16px;border-radius:20px;cursor:pointer;font-size:14px;}
        .chip.active{background:var(--pink);color:#fff;border-color:var(--pink);}

        #heroWrap{position:relative;}
        .slide{position:relative;height:330px;overflow:hidden;cursor:pointer;display:flex;align-items:flex-end;}
        .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
        .slide .ov{position:relative;z-index:2;width:100%;padding:28px 40px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.9));}
        .slide h2{font-size:34px;margin:6px 0;}
        .tagx{background:var(--pink);padding:3px 10px;border-radius:10px;font-size:12px;font-weight:bold;}
        .nv{position:absolute;top:45%;z-index:3;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:30px;width:42px;height:56px;cursor:pointer;}
        .nv.l{left:0;} .nv.r{right:0;}
        .dots{position:absolute;bottom:8px;right:30px;z-index:3;}
        .dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffffff77;margin-left:6px;cursor:pointer;}
        .dots i.on{background:var(--pink);}

        .tabs{padding:10px 30px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;}
        .tabs button{border:none;background:none;color:var(--muted);padding:10px 16px;font-size:16px;cursor:pointer;border-bottom:3px solid transparent;}
        .tabs button.active{border-bottom-color:var(--pink);color:#fff;font-weight:bold;}
        .container{padding:26px 30px;}
        .sec{font-size:20px;margin:0 0 14px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px;}
        .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s;}
        .card:hover{border-color:var(--pink);transform:translateY(-6px);}
        .poster{position:relative;height:270px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:10px;}
        .poster .ph{font-weight:bold;font-size:18px;}
        .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
        .badge{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);color:#fff;font-size:13px;padding:5px 8px;z-index:2;text-align:left;}
        .info{padding:10px 12px;}
        .info h3{font-size:15px;margin-bottom:3px;}
        .info p{color:var(--muted);font-size:12px;}

        /* modal */
        #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;z-index:50;}
        .box{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:720px;width:96%;max-height:95vh;overflow:auto;position:relative;}
        .box.full{max-width:980px;width:100%;height:100vh;max-height:100vh;border-radius:0;padding:0;}
        .box.screenfull{max-width:none;width:100%;height:100vh;max-height:100vh;border-radius:0;padding:0;border:none;background:#0b0d14;}
        .x{position:absolute;top:10px;right:14px;font-size:22px;cursor:pointer;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:34px;height:34px;z-index:30;}
        .btn{padding:11px 20px;border:none;border-radius:6px;cursor:pointer;font-size:15px;background:linear-gradient(90deg,#e11d2e,#b3121f);color:#fff;}
        .btn.sec{background:#252b3b;color:var(--text);}
        .btn:disabled{background:#3a4258;color:#888;cursor:not-allowed;}
        .bar{display:flex;gap:10px;margin-top:16px;} .bar .btn{flex:1;}

        /* detail page */
        .banner{position:relative;height:300px;overflow:hidden;}
        .banner img{width:100%;height:100%;object-fit:cover;}
        .banner iframe{width:100%;height:100%;border:none;}
        .playb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);color:#fff;border:none;padding:12px 22px;border-radius:30px;font-size:18px;cursor:pointer;z-index:3;}
        .strip{position:absolute;bottom:0;left:0;right:0;background:#000;color:#fff;text-align:center;padding:9px;font-weight:bold;z-index:3;}
        .dbody{padding:18px 24px 90px;}
        .rate{font-size:26px;font-weight:bold;margin:6px 0;} .rate small{font-size:14px;font-weight:normal;color:var(--muted);}
        .meta{color:var(--muted);margin:6px 0 12px;font-size:15px;}
        .pick{margin:10px 0;} .pick b{display:block;margin-bottom:6px;font-size:14px;} .pick .chip{margin:0 6px 6px 0;}
        .trend{display:flex;align-items:center;gap:12px;border:1px solid #2b3a66;border-radius:10px;padding:8px;margin:16px 0;}
        .trend span{background:linear-gradient(90deg,#4f7cff,#7aa2ff);color:#fff;padding:8px 14px;border-radius:8px;font-weight:bold;}
        .hs{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;}
        .offer{min-width:230px;border:1px dashed var(--pink);background:#1a1420;color:#eee;border-radius:12px;padding:12px;cursor:pointer;}
        .offer.on{background:#0f2a1a;border-color:#1ea83c;}
        .offer b{display:block;margin-bottom:4px;} .offer small{color:#aaa;}
        .castc{text-align:center;min-width:92px;font-size:13px;}
        .av{width:84px;height:84px;border-radius:50%;overflow:hidden;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#4b1fa8,#e11d2e);position:relative;}
        .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
        .rv{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;font-size:14px;}
        .rcard{min-width:140px;cursor:pointer;} .rcard .poster{height:200px;border-radius:8px;overflow:hidden;}
        .rcard p{font-size:13px;margin-top:4px;}
        .stick{position:sticky;bottom:0;background:#0f1320;padding:12px 24px;border-top:1px solid var(--line);z-index:6;}
        .stick .btn{width:100%;padding:16px;font-size:18px;border-radius:10px;}
        .dbody h3{margin:20px 0 10px;}

        /* theatre + date + showtime */
        .dts{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;}
        .dt{min-width:62px;text-align:center;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted);}
        .dt b{display:block;font-size:22px;color:var(--text);}
        .dt.on{background:var(--pink);color:#fff;} .dt.on b{color:#fff;}
        .th{border-top:1px solid var(--line);padding:14px 0;}
        .thn{font-weight:bold;margin-bottom:10px;}
        .tg{display:flex;flex-wrap:wrap;gap:10px;}
        .show{min-width:104px;padding:8px 10px;border-radius:6px;background:#141824;color:var(--text);cursor:pointer;font-size:14px;border:2px solid #1ea83c;}
        .show small{display:block;font-size:10px;color:var(--muted);margin-top:2px;}
        .show.fill{border-color:#f0a500;}
        .show.past{border-color:#333;color:#555;cursor:not-allowed;}
        .lg{font-size:12px;color:var(--muted);margin:6px 0;}

        /* FULL SCREEN SEAT PAGE */
        .sp{position:relative;height:100vh;overflow:auto;}
        .sp-top{position:relative;padding:20px 40px 24px;overflow:hidden;border-bottom:1px solid var(--line);}
        .sp-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(14px) brightness(.35);transform:scale(1.15);}
        .sp-bgc{position:absolute;inset:0;}
        .sp-in{position:relative;z-index:2;}
        .crumb{font-size:12px;color:var(--muted);margin-bottom:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
        .crumb a{cursor:pointer;color:#ccc;}
        .crumb .on{color:#fff;border-bottom:2px solid var(--pink);padding-bottom:3px;}
        .mv{display:flex;gap:22px;flex-wrap:wrap;}
        .mv .pp{width:130px;height:190px;border-radius:8px;overflow:hidden;position:relative;flex-shrink:0;}
        .mv .pp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
        .mv .tt{flex:1;min-width:240px;}
        .mv h2{font-size:26px;margin:6px 0;}
        .pills{display:flex;gap:8px;align-items:center;font-size:12px;color:#ccc;flex-wrap:wrap;}
        .pill{background:#e6a100;color:#000;padding:2px 7px;border-radius:4px;font-weight:bold;font-size:11px;}
        .dtl{display:flex;gap:40px;margin-top:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
        .dtl b{display:block;color:#fff;margin-top:6px;font-size:15px;}
        .sp-main{display:flex;gap:30px;padding:24px 40px 60px;flex-wrap:wrap;}
        .sp-left{flex:1;min-width:300px;}
        .sp-right{width:300px;flex-shrink:0;}
        .sp-h{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
        .sp-h h3{font-weight:normal;font-size:22px;}
        .lgd{display:flex;gap:16px;font-size:11px;color:var(--muted);}
        .lgd i{display:inline-block;width:12px;height:12px;border:1px solid #666;border-radius:3px;margin-right:5px;vertical-align:middle;}
        .lgd .sl i{background:var(--pink);border-color:var(--pink);} .lgd .bk i{background:#2b3040;border-color:#2b3040;}
        .curve{height:26px;margin:18px 30px 6px;border-top:3px solid #3a4258;border-radius:50%/100% 100% 0 0;box-shadow:0 -14px 24px -10px rgba(120,140,255,.35);}
        .curve-l{text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px;}
        .timer{background:#2a1f10;color:#f0b24a;padding:8px;border-radius:6px;text-align:center;font-weight:bold;font-size:13px;margin-bottom:14px;}
        .auto{margin:6px 0 4px;font-size:13px;color:var(--muted);}

        /* theatre seat map */
        .seats{overflow-x:auto;padding-bottom:10px;}
        .map{width:max-content;margin:0 auto;padding:0 6px;}
        .tier{font-size:13px;color:#cfd4e6;border-bottom:1px solid var(--line);padding:16px 0 8px;margin-bottom:8px;}
        .tier b{color:#fff;}
        .row{display:flex;justify-content:center;gap:16px;margin:7px 0;align-items:center;}
        .row>b{width:16px;font-size:12px;color:var(--muted);text-align:center;}
        .blk{display:flex;gap:5px;}
        .seat{width:var(--s);height:var(--s);border:1px solid #3a8f55;border-radius:6px 6px 2px 2px;background:transparent;color:#9fd6b2;cursor:pointer;font-size:10px;padding:0;}
        .seat:hover:not(.taken){border-color:var(--pink);color:#fff;}
        .seat.sel{background:var(--pink);border-color:var(--pink);color:#fff;}
        .seat.taken{background:#2b3040;border-color:#2b3040;color:#4a5068;cursor:not-allowed;}
        .sel-t{font-size:12px;color:var(--muted);margin-bottom:10px;}
        .sl-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
        .sl-row span:first-child{color:#fff;}
        .sl-row u{cursor:pointer;color:var(--muted);text-decoration:none;margin-left:10px;}
        .empty{color:var(--muted);font-size:13px;padding:10px 0;}
        .buy{width:100%;margin-top:18px;padding:14px;border:none;border-radius:30px;background:linear-gradient(90deg,#e11d2e,#b3121f);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;}
        .buy:disabled{background:#3a4258;color:#888;cursor:not-allowed;}

        /* other steps */
        .snack{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
        .snack .q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--pink);background:none;color:var(--pink);cursor:pointer;font-size:16px;}
        .snack .q span{display:inline-block;width:26px;text-align:center;}
        input[type=text],input[type=password],input[type=tel],select{padding:10px;border:1px solid var(--line);border-radius:6px;background:#1a2030;color:var(--text);font-size:14px;}
        .pay{display:block;padding:12px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer;}
        .pay input{margin-right:10px;}
        .sum{background:#0f1320;padding:12px;border-radius:8px;margin-top:12px;font-size:14px;line-height:1.8;}
        .sum .t{font-weight:bold;font-size:17px;color:var(--pink);}
        .bk{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;font-size:14px;}
        .upihint{background:#0f1320;border:1px dashed #3a4258;border-radius:10px;padding:12px;margin:10px 0;font-size:13px;color:var(--muted);}

        /* payment details form */
        .pform{background:#0f1320;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;}
        .pform h4{font-size:15px;margin-bottom:10px;}
        .fld{margin-bottom:10px;}
        .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
        .fld input,.fld select{width:100%;}
        .frow{display:flex;gap:10px;} .frow .fld{flex:1;}
        .secure{font-size:11px;color:#f0b24a;margin-top:4px;}

        /* UPI SCANNER PAGE */
        .scanpg{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#1b2140 0,#070910 70%);padding:20px;}
        .sc-in{text-align:center;width:100%;max-width:380px;}
        .sc-h{font-size:24px;font-weight:bold;}
        .sc-s{color:var(--muted);font-size:13px;margin:4px 0 18px;}
        .viewf{position:relative;display:inline-block;padding:26px;}
        .viewf .c{position:absolute;width:34px;height:34px;border:4px solid #22e06b;}
        .c1{top:0;left:0;border-right:none!important;border-bottom:none!important;border-radius:10px 0 0 0;}
        .c2{top:0;right:0;border-left:none!important;border-bottom:none!important;border-radius:0 10px 0 0;}
        .c3{bottom:0;left:0;border-right:none!important;border-top:none!important;border-radius:0 0 0 10px;}
        .c4{bottom:0;right:0;border-left:none!important;border-top:none!important;border-radius:0 0 10px 0;}
        .qrwrap{position:relative;display:inline-block;background:#fff;padding:12px;border-radius:10px;overflow:hidden;}
        .qrwrap svg{display:block;width:210px;height:210px;}
        .scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#22e06b,transparent);box-shadow:0 0 14px #22e06b;animation:scan 2s ease-in-out infinite;}
        @keyframes scan{0%{top:4%}50%{top:96%}100%{top:4%}}
        .sc-in .amt{font-size:30px;font-weight:bold;color:#fff;margin:10px 0 2px;}
        .sc-in .upi{font-size:14px;color:var(--muted);}
        .sc-in .qt{margin:12px auto;display:inline-block;background:#2a1f10;color:#f0b24a;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:bold;}
        .apps{display:flex;gap:8px;justify-content:center;margin:10px 0 4px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
        .apps span{border:1px solid var(--line);padding:5px 12px;border-radius:14px;}
        .sc-note{font-size:11px;color:var(--muted);margin-top:10px;}

        /* ORDER CONFIRMED */
        .conf{position:relative;text-align:center;overflow:hidden;padding:10px 4px 4px;}
        .tick{width:92px;height:92px;margin:6px auto 4px;}
        .tick circle{fill:none;stroke:#22c55e;stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:draw .7s ease forwards;}
        .tick path{fill:none;stroke:#22c55e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .6s ease forwards;}
        @keyframes draw{to{stroke-dashoffset:0}}
        .conf h2{font-size:26px;color:#22c55e;opacity:0;animation:up .6s 1s forwards;}
        .conf .sub{color:var(--muted);font-size:13px;margin:4px 0 14px;opacity:0;animation:up .6s 1.2s forwards;}
        .ticket{border:2px dashed var(--pink);border-radius:12px;padding:16px;text-align:center;opacity:0;animation:up .6s 1.4s forwards;background:#0f1320;}
        .ticket h3{font-size:22px;} .ticket p{margin:5px 0;font-size:14px;}
        .bars{margin-top:12px;height:46px;} .bars i{display:inline-block;height:46px;background:#fff;margin-right:2px;}
        .enjoy{margin-top:18px;font-size:24px;font-weight:bold;opacity:0;animation:up .7s 1.9s forwards;background:linear-gradient(90deg,#f7b733,#e11d2e);-webkit-background-clip:text;background-clip:text;color:transparent;}
        .conf .bar{opacity:0;animation:up .6s 2.1s forwards;}
        @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        .cf{position:absolute;top:-10px;width:8px;height:14px;opacity:.9;animation:fall linear forwards;}
        @keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}

        @media(max-width:700px){:root{--s:21px}.slide{height:220px}.slide h2{font-size:22px}.banner{height:200px}.sp-top,.sp-main{padding-left:16px;padding-right:16px}.sp-right{width:100%}.row{gap:10px}.blk{gap:3px}}
        @media print{body *{visibility:hidden;} .ticket,.ticket *{visibility:visible;} .ticket{position:absolute;left:0;top:0;width:100%;}}
    </style>
</head>
<body>

<div id="splash">
    <div class="logo" id="splashLogo"></div>
    <p>🎬 Unga show, unga seat 🎤</p>
    <div class="ld"><i></i></div>
</div>

<header>
    <h1 id="appName"></h1>
    <div class="hr">
        <input id="search" placeholder="🔍 Search movie / concert" oninput="q=this.value;render()">
        <span id="langs"></span>
        <button class="chip" onclick="showMyBookings()">🎟️ My Bookings</button>
    </div>
</header>

<div id="heroWrap"><div id="hero"></div></div>

<div class="tabs" id="tabs">
    <button data-v="NOW_SHOWING" onclick="setTab('NOW_SHOWING')">Now Showing</button>
    <button data-v="UPCOMING" onclick="setTab('UPCOMING')">Coming Soon</button>
    <button data-v="RE_RELEASE" onclick="setTab('RE_RELEASE')">Re-Release</button>
    <button data-v="CONCERT" onclick="setTab('CONCERT')">Concerts</button>
</div>

<div class="container">
    <h2 class="sec" id="secTitle"></h2>
    <div class="grid" id="grid"></div>
</div>

<div id="modal"><div class="box" id="box"></div></div>

<script>
    const APP_NAME='KollyTix';
    const SPLASH_MS=3500;

    let movies=[], lang='All', tab='NOW_SHOWING', q='', cur=null, st={}, timer=null, qrTimer=null;
    let heroList=[], heroIdx=0, heroTimer=null;
    const $=id=>document.getElementById(id);
    const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const label={NOW_SHOWING:'In cinemas',UPCOMING:'Coming soon',RE_RELEASE:'Re-release',CONCERT:'Live concert'};
    const titles={NOW_SHOWING:'Now Showing',UPCOMING:'Coming Soon',RE_RELEASE:'Re-Release',CONCERT:'Concerts'};
    const icons={NOW_SHOWING:'🎬',UPCOMING:'🎞️',RE_RELEASE:'🔁',CONCERT:'🎤'};
    const SNACKS=[{n:'🍿 Popcorn',p:150},{n:'🥤 Coke',p:90},{n:'🌮 Nachos',p:120},{n:'🍔 Combo',p:300}];
    const OFFERS=[
        {c:'B1G1',t:'🎁 Buy 1 Get 1',d:'2 seats eduthaa onnu free (code B1G1)'},
        {c:'TAMIL50',t:'🏷️ Flat ₹50 off',d:'Code TAMIL50'},
        {c:'FIRST10',t:'💳 First booking 10% off',d:'Code FIRST10'},
        {c:'',t:'🍿 Combo ₹300',d:'Popcorn + Coke + Nachos, snacks step la'}
    ];

                BLOCKS.forEach(([a,z])=>{
                    h+='<div class="blk">';
                    for(let n=a;n<=z;n++){

        });

    /* ---------- demo QR ---------- */
    function fakeQR(seed){
        const N=25; let s=(seed*9301+49297)%233280||1;
        const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
        const finder=(x,y)=>(x<7&&y<7)||(x>=N-7&&y<7)||(x<7&&y>=N-7);
        let r='';
        for(let y=0;y<N;y++)for(let x=0;x<N;x++){
            let on;
            if(finder(x,y)){
                const fx=x<7?x:x-(N-7), fy=y<7?y:y-(N-7);
                on=(fx===0||fx===6||fy===0||fy===6)||(fx>=2&&fx<=4&&fy>=2&&fy<=4);
            } else on=rnd()>0.52;
            if(on) r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
        }
        return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" fill="#111">${r}</svg>`;
    }

      <div style="margin-top:6px"><input type="text" id="cpn" placeholder="B1G1 / TAMIL50 / FIRST10" value="${st.coupon}">
      <button class="chip" onclick="applyCoupon()">Apply</button></div>
      <p style="font-size:13px;margin-top:6px">${st.couponMsg}</p>
      <div class="sum">Tickets: ₹${seatsTotal()}<br>Snacks: ₹${snackTotal()}<br>Discount: -₹${discount()}<br><span class="t">Total: ₹${total()}</span></div>
      <div class="bar"><button class="btn sec" onclick="go(1)">Back</button><button class="btn" onclick="go(3)">Next: Payment</button></div>`;
        }

        if(st.step===3){
            const methods=[['UPI','📱 UPI (GPay / PhonePe)'],['Card','💳 Credit / Debit Card'],['NetBanking','🏦 Net Banking'],['Wallet','👛 Wallet'],['Pay at Theatre','🎟️ Pay at Theatre']];
            const upi=st.pay==='UPI';
            const btnTxt=upi?'📱 Pay ₹'+total()+' with UPI':'Pay ₹'+total();
            b.innerHTML=X+`<h3>Payment</h3>`+methods.map(([v,l])=>
                    `<label class="pay"><input type="radio" name="pm" ${st.pay===v?'checked':''} onchange="st.pay='${v}';view()">${l}</label>`).join('')+
                payForm()+
                `<div class="sum">👯 Split with friends?
        <select onchange="st.friends=+this.value;view()">${[1,2,3,4,5,6].map(n=>`<option ${st.friends===n?'selected':''}>${n}</option>`).join('')}</select> per head
        <br>Per person: <b>₹${Math.ceil(total()/st.friends)}</b><br><span class="t">Total: ₹${total()}</span></div>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">⚠️ Demo payment. No real money is charged.</p>
      <div class="bar"><button class="btn sec" onclick="go(2)">Back</button>
      <button class="btn" id="payBtn" onclick="startPay()">${btnTxt}</button></div>`;
        }

        if(st.step===6){
            b.innerHTML=`<div class="scanpg">
      <button class="x" onclick="go(3)">✕</button>
      <div class="sc-in">
        <div class="sc-h">Scan & Pay</div>
        <div class="sc-s">${m.title} • ${st.seats.length} ticket${st.seats.length>1?'s':''} • ${st.seats.join(', ')}</div>
        <div class="viewf"><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i>
          <div class="qrwrap">${fakeQR(Math.round(total())+cur.id*7)}<div class="scanline"></div></div></div>
        <div class="amt">₹${total()}</div>
        <div class="upi">Paying to kollytix@upi</div>
        <div class="qt" id="qt">⏳ QR expires in 5:00</div>
        <div class="apps"><span>GPay</span><span>PhonePe</span><span>Paytm</span><span>BHIM</span></div>
        <div class="bar"><button class="btn sec" onclick="go(3)">Cancel</button>
        <button class="btn" id="payBtn" onclick="pay()">Pay ₹${total()}</button></div>
        <div class="sc-note">Scan this QR with any UPI app. (Demo QR)</div>
      </div></div>`;
            startQrTimer();
        }

        if(st.step===4){
            const k=st.booking, concert=m.category==='CONCERT';
            b.innerHTML=X+`<div class="conf">${confetti()}
      <svg class="tick" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-16"/></svg>
      <h2>Order Confirmed!</h2>
      <div class="sub">Payment successful • ${k.paymentMethod} • ₹${k.amount}</div>
      <div class="ticket">
        <h3>${k.movieTitle}</h3>
        <p>${k.language} | ${k.format}</p>
        <p>📍 ${st.theatre} | 📅 ${st.dateLabel} | 🕒 ${st.time}</p>
        <p>💺 Seats: <b>${k.seats}</b></p>
        <p style="color:var(--muted);font-size:12px">${k.bookedAt}</p>
        <div class="bars">${k.bookingCode.split('').map(c=>`<i style="width:${1+c.charCodeAt(0)%4}px"></i>`).join('')}</div>
        <p><b>${k.bookingCode}</b></p>
      </div>
      <div class="enjoy">${concert?'Enjoy the show! 🎤🔥':'Enjoy the cinema! 🍿🎬'}</div>
      <div class="bar"><button class="btn sec" onclick="window.print()">🖨️ Print / Save</button>
      <button class="btn" onclick="closeModal()">Done</button></div>
    </div>`;
        }
    }

    function toggle(id){st.seats=st.seats.includes(id)?st.seats.filter(s=>s!==id):[...st.seats,id];view();}
    function snack(i,d){st.snacks[i]=Math.max(0,(st.snacks[i]||0)+d);view();}
    function applyCoupon(){
        const c=$('cpn').value.trim().toUpperCase();
        if(c===''){st.coupon='';st.couponMsg='';}
        else if(c==='B1G1'){st.coupon=c;st.couponMsg=st.seats.length>=2?'✅ B1G1 apply aachu':'⚠️ B1G1 ku minimum 2 seats venum';}
        else if(c==='TAMIL50'||c==='FIRST10'){st.coupon=c;st.couponMsg='✅ Coupon apply aachu';}
        else{st.coupon='';st.couponMsg='❌ Invalid coupon';}
        view();
    }
    function autoPick(){
        const n=+$('autoN').value;
        const rowOrder=[...ROWS.keys()].sort((a,b)=>Math.abs(a-3)-Math.abs(b-3));
        const blockOrder=[BLOCKS[1],BLOCKS[0],BLOCKS[2]];
        for(const r of rowOrder){
            const L=ROWS[r];
            for(const [a,z] of blockOrder){
                if(n>z-a+1) continue;
                const centre=(a+z)/2;
                const starts=[];
                for(let s=a;s<=z-n+1;s++) starts.push(s);
                starts.sort((x,y)=>Math.abs(x+(n-1)/2-centre)-Math.abs(y+(n-1)/2-centre));
                for(const s of starts){
                    const ids=[...Array(n).keys()].map(i=>L+(s+i));
                    if(ids.every(id=>!isTaken(id))){st.seats=ids;view();return;}
                }
            }
        }
        alert('Together ah seats illa 😅');
    }

    async function pay(){
        const pb=$('payBtn'); pb.disabled=true;
        pb.innerText=st.pay==='NetBanking'?'Redirecting to bank...':'Processing payment...';
        await new Promise(r=>setTimeout(r,1500));
        const res=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({movieId:cur.id,seats:st.seats,language:st.lang,format:st.format,
                paymentMethod:st.pay,snackAmount:snackTotal(),coupon:st.coupon})});
        if(!res.ok){alert('❌ '+await res.text());go(1);load();return;}
        st.booking=await res.json(); clearInterval(timer); st.step=4; view(); load();
    }

    async function showMyBookings(){
        const list=await (await fetch('/api/bookings')).json();
        $('modal').style.display='flex'; $('box').className='box';
        $('box').innerHTML=`<button class="x" style="background:none;color:var(--text)" onclick="closeModal()">✕</button><h2>🎟️ My Bookings</h2>`+
            (list.length?list.map(k=>`<div class="bk"><b>${k.movieTitle}</b> (${k.language}, ${k.format})<br>
      💺 ${k.seats} | ₹${k.amount} | ${k.paymentMethod}<br>
      <span style="color:var(--muted)">${k.bookingCode} | ${k.bookedAt}</span></div>`).join(''):'<p style="margin-top:10px">Innum booking illa</p>');
    }
    load();
</script>
</body>
</html>
